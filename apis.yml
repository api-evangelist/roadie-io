aid: roadie-io
url: https://raw.githubusercontent.com/api-evangelist/roadie-io/refs/heads/main/apis.yml
name: Roadie
kind: company
description: >-
  Roadie is managed Backstage - a fully hosted internal developer portal (IDP)
  and software catalog delivered as SaaS, so teams get the Backstage software
  catalog, TechDocs, Scaffolder software templates, Tech Insights scorecards,
  and 75+ plugins without operating Backstage themselves. Roadie exposes a
  public REST API under https://api.roadie.so/api (Bearer-token authenticated
  with User or Service tokens) for reading catalog entities, pushing
  Roadie-managed entities and idempotent entity sets into the software catalog,
  running Scaffolder templates, and querying Tech Insights facts, checks, and
  scorecards. Roadie also ships six agent-native MCP servers over the same API
  base. Backstage itself is free and open source; Roadie is the commercial
  managed product, priced per contributing developer. Operated by Larder
  Software Limited.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Software Catalog
- Internal Developer Portal
- Backstage
- Developer Experience
- IDP
- Developer Portal
- Managed Backstage
- Scaffolder
- TechDocs
- Service Catalog
- Platform Engineering
