actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Roadie's own public API. The API is
    request/response REST (Catalog, entity-push, Scaffolder v2, Tech Insights,
    TechDocs), with one Server-Sent Events stream for scaffolder task progress
    and six MCP servers over streamable HTTP. No AsyncAPI document was created
    because there is no documented server-push WebSocket transport to model.
