principles:
- name: Visibility
  description: Track the count of contributing developer seats and the plan tier; API access is bundled, not separately metered.
- name: Allocation
  description: Map contributing seats to teams so the per-developer subscription maps to internal cost centers.
- name: Optimization
  description: Right-size contributing seats, keep non-coding users on free viewer access, and weigh managed Roadie against self-hosting Backstage based on platform-team capacity.
- name: Accountability
  description: Assign a platform-engineering owner for the Roadie subscription and review seat counts and tier fit each billing cycle.
