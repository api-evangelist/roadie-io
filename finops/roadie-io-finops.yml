meters:
- name: contributing_developers
  description: Developers who write tracked code, the per-seat basis for Teams and Growth plans.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: enterprise_context
  description: Organization-level Enterprise Context subscription, priced per organization.
  unit: contract
  aggregation: max
  dimensions:
  - account
- name: self_hosted_backstage
