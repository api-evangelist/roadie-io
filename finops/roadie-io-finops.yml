description: >-
  FinOps view of Roadie spend. Roadie is a managed-Backstage SaaS billed per
  contributing developer per month (developers who write tracked code; non-coding
  viewers are free), with a Teams tier at a fixed per-developer rate and a Growth
  tier at custom per-developer pricing that unlocks REST API access. A separate
  Enterprise Context product is priced per organization. Because billing is
  seat-based rather than usage-metered, the primary cost driver is the count of
  contributing developers, and the API itself carries no separate per-call fee -
  it is included with the plan tier that grants API access. The comparison point
  is self-hosting open-source Backstage, where there is no license fee but the
  cost shifts to the platform team's own infrastructure and engineering time.
notes: >-
  Per-developer rates are not reconciled here; verify on roadie.io/pricing. The
  main optimization levers are managing the number of contributing seats and
  choosing managed Roadie versus self-hosted Backstage based on platform-team
  capacity.
